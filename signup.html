<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NEXORA - Sign Up</title>

<style>

* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #f3f5f9;
    display: flex;
    justify-content: center;
    align-items: center;
}

.card {
    width: 390px;
    max-width: 90%;
    background: white;
    padding: 35px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
}

.logo {
    text-align: center;
    color: #5b5cf0;
    font-size: 32px;
    font-weight: bold;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #777;
    margin-bottom: 25px;
}

input {
    width: 100%;
    padding: 13px;
    margin-bottom: 14px;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 15px;
    outline: none;
}

input:focus {
    border-color: #5b5cf0;
}

button {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: #5b5cf0;
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

.login {
    text-align: center;
    margin-top: 20px;
    color: #777;
}

.login a {
    color: #5b5cf0;
    font-weight: bold;
    text-decoration: none;
}

</style>
</head>

<body>

<div class="card">

    <div class="logo">NEXORA</div>

    <div class="subtitle">
        Create your account
    </div>

    <form>

        <input
            type="text"
            placeholder="Full Name"
            required
        >

        <input
            type="email"
            placeholder="Email"
            required
        >

        <input
            type="password"
            placeholder="Password"
            required
        >

        <input
            type="password"
            placeholder="Confirm Password"
            required
        >

        <button type="submit">
            Create Account
        </button>

    </form>

    <div class="login">
        Already have an account?
        <a href="login.html">Log In</a>
    </div>

</div>

</body>
</html>
